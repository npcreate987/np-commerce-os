<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B26"/>
      <stop offset="50%" stop-color="#2A0F3E"/>
      <stop offset="100%" stop-color="#190818"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FF3E5C" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6BD9"/>
      <stop offset="50%" stop-color="#FF3E5C"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>
  <rect width="2732" height="2732" fill="url(#glow)"/>

  <!-- Centred icon block (1000×1000) -->
  <g transform="translate(866 866)">
    <rect width="1000" height="1000" rx="232" fill="rgba(255,255,255,0.05)"/>
    <g font-family="Anuphan, 'SF Pro Display', Helvetica, Arial, sans-serif"
       font-weight="900" text-anchor="middle" filter="url(#neon)">
      <text x="500" y="463" font-size="320" fill="url(#word)" letter-spacing="-8">TuK</text>
      <text x="500" y="780" font-size="320" fill="url(#word)" letter-spacing="-8">TuK</text>
    </g>
    <circle cx="820" cy="828" r="34" fill="#22D3EE" opacity="0.9"/>
  </g>

  <!-- Bottom tagline -->
  <text x="1366" y="2380" fill="rgba(255,255,255,0.78)"
        font-family="Anuphan, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="76" text-anchor="middle" letter-spacing="2">TuKTuK</text>
</svg>
