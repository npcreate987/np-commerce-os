name: mobile-live-update

# Phase 18 — Capacitor Live Updates (OTA) publisher.
#
# Trigger: push tag `live-v*` หรือ manual dispatch.
# Output: zip ของ `apps/web/out/` + sha256 → upload Cloudflare R2 + bump manifest.
#
# Flow:
#   1) Build static export (Next.js)
#   2) Hash + zip → `web-bundle-<sha>.zip`
#   3) Upload Cloudflare R2 (S3-compatible API, versioned + immutable URL)
#   4) PATCH manifest env vars บน API host (optional — skipped ถ้า hook URL ไม่ set)
#   5) Smoke test: hit `/v1/app/live-updates/manifest` แล้วยืนยันค่า
#   6) Job summary: emit env vars สำหรับ manual update (เผื่อ API ยังไม่ deploy)
#
# Secrets (ต้องมี):
#   R2_ACCESS_KEY_ID               # Cloudflare R2 API token — Object Read & Write
#   R2_SECRET_ACCESS_KEY
#   R2_ENDPOINT_URL                # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#   R2_BUCKET                      # np-commerce-live-updates
#   R2_PUBLIC_BASE                 # https://pub-<RANDOM>.r2.dev  (public dev URL)
#   SENTRY_AUTH_TOKEN
#   SENTRY_ORG
#   SENTRY_PROJECT_WEB             # javascript-nextjs (already used by Phase 13.1)
#
# Secrets (optional — ถ้าตั้งไว้จะ auto-update; ถ้าไม่ตั้ง emit ให้ user manual update):
#   API_DEPLOY_HOOK_URL            # webhook to bump manifest on API host
#                                  # = ${API_URL}/v1/app/live-updates/webhook
#   LIVE_UPDATES_WEBHOOK_SECRET    # HMAC secret (SAME value as the API env var
#                                  # of the same name — they sign+verify the
#                                  # same bytes; rename them in lockstep on
#                                  # any rotation)
#   API_URL                        # https://api.example.com  (สำหรับ smoke test)

on:
  push:
    tags:
      - 'live-v*'
  workflow_dispatch:
    inputs:
      rollout_pct:
        description: 'Production rollout percentage (0-100)'
        required: true
        default: '10'
      channel:
        description: 'Channel (production | beta)'
        required: true
        default: 'beta'
        type: choice
        options:
          - production
          - beta

concurrency:
  group: mobile-live-update
  cancel-in-progress: false

jobs:
  publish:
    name: Publish OTA bundle
    runs-on: ubuntu-22.04
    environment:
      name: ota-${{ inputs.channel || 'beta' }}
    timeout-minutes: 30
    env:
      # Expose optional secrets as env vars เพื่อให้ `if:` ตรวจ "ถูกตั้ง?" ได้
      # (GitHub Actions ห้ามใช้ `secrets.X` ใน step-level `if:` แบบตรงๆ ในบาง runner)
      API_DEPLOY_HOOK_URL: ${{ secrets.API_DEPLOY_HOOK_URL }}
      API_URL: ${{ secrets.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version ดึงจาก `packageManager` ใน root package.json (pnpm@9.0.0)
        # ห้ามใส่ `version:` ที่นี่ — เกิด ERR_PNPM_BAD_PM_VERSION

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve build id
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=10 HEAD)
          VERSION=$(node -p "require('./apps/web/package.json').version || '1.0.0'")
          BUILD_ID="${VERSION}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build static export
        env:
          BUILD_STATIC: 'true'
          NEXT_PUBLIC_APP_VERSION: ${{ steps.meta.outputs.version }}
          NEXT_PUBLIC_APP_BUILD: ${{ steps.meta.outputs.short_sha }}
          NEXT_PUBLIC_SENTRY_RELEASE: live-${{ steps.meta.outputs.build_id }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: pnpm --filter web build

      - name: Package bundle
        id: pkg
        working-directory: apps/web/out
        run: |
          zip -r -9 ../../../web-bundle-${{ steps.meta.outputs.build_id }}.zip .
          cd ../../..
          BUNDLE=web-bundle-${{ steps.meta.outputs.build_id }}.zip
          CHECKSUM=$(sha256sum "$BUNDLE" | awk '{ print $1 }')
          SIZE=$(stat -c%s "$BUNDLE")
          echo "bundle=$BUNDLE" >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload to Cloudflare R2 (versioned + immutable)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 ไม่มี region จริง — ตั้ง 'auto' ตาม Cloudflare docs ก็พอ
          # https://developers.cloudflare.com/r2/api/s3/tokens/#aws-cli
        run: |
          aws s3 cp \
            "${{ steps.pkg.outputs.bundle }}" \
            "s3://${{ secrets.R2_BUCKET }}/bundles/${{ steps.pkg.outputs.bundle }}" \
            --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/zip" \
            --checksum-algorithm CRC32

      - name: Resolve bundle public URL
        id: url
        run: |
          BUNDLE_URL="${{ secrets.R2_PUBLIC_BASE }}/bundles/${{ steps.pkg.outputs.bundle }}"
          echo "bundle_url=$BUNDLE_URL" >> $GITHUB_OUTPUT
          echo "Bundle uploaded — $BUNDLE_URL"

      - name: Bump API manifest via webhook
        if: env.API_DEPLOY_HOOK_URL != ''
        # Build a *canonical* JSON payload (compact, no trailing newline)
        # with jq so the HMAC bytes match what curl POSTs to the API
        # byte-for-byte. Using `printf '%s'` for both signing and POSTing
        # avoids `echo`'s trailing newline (which would shift the HMAC by
        # 1 byte vs. what `--data-binary @-` actually sends).
        #
        # The API verifies the signature against `req.rawBody` captured by
        # a Fastify content-type parser (see `apps/api/src/main.ts`), so
        # any normalization (re-ordering keys, stripping whitespace) would
        # break verification. Keep this step strictly raw.
        run: |
          PAYLOAD=$(jq -cn \
            --arg channel "${{ inputs.channel || 'beta' }}" \
            --arg version "${{ steps.meta.outputs.version }}" \
            --arg buildId "${{ steps.meta.outputs.build_id }}" \
            --arg url "${{ steps.url.outputs.bundle_url }}" \
            --arg checksum "${{ steps.pkg.outputs.checksum }}" \
            --argjson size ${{ steps.pkg.outputs.size }} \
            --argjson rolloutPct ${{ inputs.rollout_pct || 10 }} \
            '{channel:$channel, version:$version, buildId:$buildId, url:$url, checksum:$checksum, size:$size, rolloutPct:$rolloutPct}')
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.LIVE_UPDATES_WEBHOOK_SECRET }}" | awk '{print $NF}')
          printf '%s' "$PAYLOAD" | curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-NP-Signature: sha256=$SIG" \
            --data-binary @- \
            "${{ secrets.API_DEPLOY_HOOK_URL }}"

      - name: Emit env vars (manual fallback when API hook ไม่ตั้ง)
        if: env.API_DEPLOY_HOOK_URL == ''
        run: |
          {
            echo "## OTA Manifest env vars (ต้อง paste ลง API host)"
            echo ""
            echo '```bash'
            echo "LIVE_UPDATES_VERSION=${{ steps.meta.outputs.version }}"
            echo "LIVE_UPDATES_BUILD_ID=${{ steps.meta.outputs.build_id }}"
            echo "LIVE_UPDATES_BUNDLE_URL=${{ steps.url.outputs.bundle_url }}"
            echo "LIVE_UPDATES_CHECKSUM=${{ steps.pkg.outputs.checksum }}"
            echo "LIVE_UPDATES_BUNDLE_SIZE_BYTES=${{ steps.pkg.outputs.size }}"
            echo "LIVE_UPDATES_ROLLOUT_PCT=${{ inputs.rollout_pct || '10' }}"
            echo "LIVE_UPDATES_PAUSE=0"
            echo '```'
            echo ""
            echo "Channel: \`${{ inputs.channel || 'beta' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test manifest
        if: env.API_URL != ''
        run: |
          curl -fsSL "${{ secrets.API_URL }}/v1/app/live-updates/manifest?platform=ios&nativeVersion=1.0.0&channel=${{ inputs.channel || 'beta' }}" \
            | tee manifest.json
          BUILD_ID=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).buildId")
          test "$BUILD_ID" = "${{ steps.meta.outputs.build_id }}" \
            || (echo "buildId mismatch — manifest=${BUILD_ID} expected=${{ steps.meta.outputs.build_id }}"; exit 1)

      - name: Notify Sentry of release
        # Non-blocking — Sentry release tagging is nice-to-have (helps tie
        # stacktraces back to bundle) but not critical for OTA delivery.
        # If it fails (token expired, network blip, etc.) the bundle is
        # still live on R2 and clients still receive it.
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_WEB }}
          RELEASE: live-${{ steps.meta.outputs.build_id }}
        run: |
          # pnpm dlx ขุดจาก pnpm store (ไม่ใช้ npx เพราะ pnpm มี node_modules
          # layout แบบ symlink ทำให้ binary lookup ของ npx fail)
          pnpm dlx @sentry/cli@latest releases new "$RELEASE"
          pnpm dlx @sentry/cli@latest releases set-commits "$RELEASE" --auto || true
          pnpm dlx @sentry/cli@latest releases files "$RELEASE" upload-sourcemaps apps/web/out --validate || true
          pnpm dlx @sentry/cli@latest releases finalize "$RELEASE"

      - name: Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.bundle }}
          path: ${{ steps.pkg.outputs.bundle }}
          retention-days: 30
