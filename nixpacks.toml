# Phase 19.2 — Railway / Nixpacks builder configuration.
#
# Without this file Nixpacks auto-detects every workspace in the
# monorepo. It would pick up apps/web's Next.js build first (it's
# the largest leaf with a `build` script) and then try to run
# `pnpm --filter web build`, which hits pre-existing ESLint errors
# in apps/web (unescaped quotes in legal/privacy etc.) and stops
# the deploy before it ever gets to the API.
#
# We want Railway to:
#   1. install ALL workspaces with pnpm (so workspace:* resolves)
#   2. build ONLY apps/api (prisma generate + nest build)
#   3. start the NestJS API server
#
# Notes
# ─────
# Pre-deploy command (`pnpm --filter api prisma migrate deploy`) is
# configured separately in the Railway dashboard, not here — Nixpacks
# doesn't have a "pre-deploy" phase concept. Don't move it here.
#
# `nixPkgs` is intentionally empty because Nixpacks reads
# `packageManager: "pnpm@9.0.0"` from the root package.json and
# installs pnpm automatically. Adding a specific Nix package would
# pin us to a stale version each upgrade.

[phases.install]
cmds = ['pnpm install --frozen-lockfile']

[phases.build]
cmds = [
  'pnpm --filter api prisma:generate',
  'pnpm --filter api build',
]

[start]
cmd = 'pnpm --filter api start'
